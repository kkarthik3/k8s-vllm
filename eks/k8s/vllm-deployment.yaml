apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Don't inject legacy Docker-link service env vars. The Service named "vllm" would
      # otherwise set VLLM_PORT=tcp://<ip>:8000, which vLLM misreads as its own listen port
      # and crashes ("VLLM_PORT ... appears to be a URI").
      enableServiceLinks: false
      # Land on the GPU node and tolerate its taint (label + taint set in terraform/eks.tf).
      nodeSelector:
        workload: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.22.1
          # The image entrypoint already runs the OpenAI API server; pass only flags as args.
          #
          # g4dn.xlarge carries the same NVIDIA T4 (Turing, SM 7.5, 15360 MiB usable) as the
          # AKS NC4as_T4_v3, so the flags are unchanged:
          #   awq (not awq_marlin) — Marlin kernels need SM 8.0+; Turing uses the AWQ GEMM path.
          #   float16              — Turing has no bfloat16.
          #   enforce-eager        — skip CUDA graph capture; buys back KV-cache headroom.
          #   max-model-len 4096 / max-num-seqs 8 — sized for a 15 GiB card.
          # If you switch to g6.xlarge (L4, SM 8.9, 24GB): use awq_marlin, drop --dtype/--enforce-eager,
          # and raise max-model-len / max-num-seqs.
          args:
            - --model=Qwen/Qwen2.5-7B-Instruct-AWQ
            - --quantization=awq
            - --dtype=float16
            - --enforce-eager
            - --gpu-memory-utilization=0.90
            - --max-model-len=4096
            - --max-num-seqs=8
            - --port=8000
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"      # g4dn.xlarge has 4 vCPU total, minus kubelet/daemonset reservation
              memory: 8Gi   # 16 GiB host RAM on g4dn.xlarge (vs 28 GiB on NC4as_T4_v3)
            limits:
              nvidia.com/gpu: "1" # k8s mirrors this to requests automatically
          # First boot pulls a ~11GB image + downloads weights, so give the startup probe
          # a long runway (~10 min) before liveness can kill the pod.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  # ClusterIP + port-forward (scripts/verify.sh). If you change this to LoadBalancer, delete the
  # Service BEFORE `terraform destroy` — the ELB it creates is not in Terraform state and will
  # block VPC deletion. scripts/destroy.sh does this for you.
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
